<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="AlphaX">
  <title>AlphaX</title>

  <!-- Mark: a hexagonal node with a crosshair "X" -- one arm lands on a
       located-contact pin, tying the mark to "pinpointing a person". -->
  <polygon points="152,80 116,17.65 44,17.65 8,80 44,142.35 116,142.35" fill="#1F1A2E"/>
  <g stroke="#E8B14A" stroke-width="15" stroke-linecap="round">
    <line x1="80" y1="80" x2="46" y2="46"/>
    <line x1="80" y1="80" x2="114" y2="46"/>
    <line x1="80" y1="80" x2="46" y2="114"/>
    <line x1="80" y1="80" x2="121" y2="121"/>
  </g>
  <circle cx="121" cy="121" r="10" fill="#F6D27A"/>

  <!-- Wordmark -->
  <text x="190" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="72" letter-spacing="-2">
    <tspan fill="#1F1A2E">Alpha</tspan><tspan fill="#B8842A">X</tspan>
  </text>
</svg>
